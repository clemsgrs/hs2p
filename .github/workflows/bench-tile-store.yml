name: Bench – fixture read and store

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU benchmark dependencies
        run: python -m pip install '.[openslide,testing]' 'wholeslidedata==0.0.15' 'numpy<2'
      - name: Test benchmark support
        run: python -m pytest -q --no-cov -m script tests/test_benchmarking.py tests/test_benchmark_tile_store.py
      - name: Measure preprocessing CPU and allocations
        run: python scripts/benchmark_preprocessing.py --cases contours_sparse contours_dense mask_decode fixture --repeat 3 --output bench-out/preprocessing.json
      - name: Measure fixture read and store
        run: |
          python scripts/benchmark_tile_read.py --config-file benchmarks/fixture.json --output-dir bench-out/read --modes regular_wsd supertiles_wsd --repeat 3 --warmup 1 --num-workers 1
          python scripts/benchmark_tile_store.py --config-file benchmarks/fixture.json --output-dir bench-out/store --workers 1 --repeat 3 --warmup 1 --jpeg-backend pil
      - name: Upload measurements
        uses: actions/upload-artifact@v4
        with:
          name: bench-fixture-results
          path: |
            bench-out/**/*.csv
            bench-out/*.json
          retention-days: 30
